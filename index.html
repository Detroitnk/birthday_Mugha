<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Something for you.</title>
  <meta name="description" content="Open when you're ready.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#150f13">
  <meta property="og:title" content="Something for you.">
  <meta property="og:description" content="Open when you're ready.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c6a267' d='M12 21s-7.5-4.9-9.7-9.2C.6 8.4 2.6 5 6 5c2 0 3.4 1 4.4 2.4a1.9 1.9 0 0 0 3.2 0C14.6 6 16 5 18 5c3.4 0 5.4 3.4 3.7 6.8C19.5 16.1 12 21 12 21z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,300..650;1,9..144,300..650&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/chapters.css">
</head>
<body>

  <!-- inline icon sprite -->
  <svg class="sr-only" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.4S5.4 16 3.5 12.2C2 9.3 3.8 6.4 6.7 6.4c1.7 0 3 .9 3.9 2.1a1.7 1.7 0 0 0 2.8 0c.9-1.2 2.2-2.1 3.9-2.1 2.9 0 4.7 2.9 3.2 5.8C18.6 16 12 20.4 12 20.4z"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18.2V6.6l9-2v11.1M9 18.2a2.3 2.3 0 1 1-4.6 0 2.3 2.3 0 0 1 4.6 0zm9-2.5a2.3 2.3 0 1 1-4.6 0 2.3 2.3 0 0 1 4.6 0z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15 9a4.2 4.2 0 0 1 0 6M17.5 6.8a7.6 7.6 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/><path d="M15.5 9.8l4.4 4.4m0-4.4-4.4 4.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="9.8" r="2.2" fill="currentColor"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M5.5 9.5 12 16l6.5-6.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.5c.7 3.9 1.9 5.6 6 6.5-4.1.9-5.3 2.6-6 6.5-.7-3.9-1.9-5.6-6-6.5 4.1-.9 5.3-2.6 6-6.5z"/></symbol>
    </defs>
  </svg>

  <noscript>
    <div class="noscript">
      <p>This little universe needs JavaScript to open.<br>Please try a regular browser. It’s worth it.</p>
    </div>
  </noscript>

  <!-- ═══════════ CHAPTER 00 · THE INVITATION (fixed overlay) ═══════════ -->
  <div id="intro" class="intro" aria-label="Invitation">
    <div class="intro__stage">
      <p class="intro__line intro__line--1" data-t="invitation.line1"></p>
      <p class="intro__line intro__line--2" data-t="invitation.line2"></p>

      <div class="intro__envelope-wrap">
        <div class="envelope" id="envelope">
          <div class="envelope__back"></div>
          <div class="envelope__card" id="env-card">
            <p class="envelope__card-title" data-t="invitation.cardTitle"></p>
            <p class="envelope__card-line" data-t="invitation.cardLine"></p>
            <button class="btn btn--gold envelope__open-btn" id="open-story" type="button">
              <span data-t="invitation.button"></span>
              <svg class="icon" aria-hidden="true"><use href="#i-right"/></svg>
            </button>
          </div>
          <div class="envelope__pocket"></div>
          <div class="envelope__flap"></div>
          <button class="envelope__seal" id="env-seal" type="button" aria-label="Break the seal and open the envelope">
            <span id="seal-initial" aria-hidden="true">♥</span>
          </button>
        </div>
      </div>

      <form class="intro__pin" id="pin-form" hidden>
        <p class="intro__pin-note" data-t="invitation.pinPrompt"></p>
        <label class="intro__pin-label" for="pin-input" data-t="invitation.pinLabel"></label>
        <input id="pin-input" class="pin-input" type="password" inputmode="numeric" autocomplete="off"
               spellcheck="false" maxlength="12" aria-describedby="pin-hint">
        <p class="intro__pin-hint" id="pin-hint"></p>
        <button class="btn btn--ghost" type="submit">Unlock</button>
      </form>
    </div>
    <button class="intro__skip" id="skip-intro" type="button">skip</button>
  </div>

  <main id="story" class="story" hidden>

    <!-- ═══════════ CHAPTER 01 · HAPPY BIRTHDAY ═══════════ -->
    <section class="chapter scene--night hero" id="hero" data-chapter data-title="Happy birthday" data-act="begin" aria-label="Happy birthday">
      <div class="hero__media" data-mount="hero-media"></div>
      <div class="hero__body">
        <p class="hero__kicker"><span data-t="hero.title1"></span> <span data-t="hero.title2"></span></p>
        <h1 class="hero__name" data-name="her"></h1>
        <p class="hero__line" data-t="hero.kicker"></p>
        <div class="counter" data-mount="counter" role="timer" aria-label="Time together"></div>
        <p class="hero__countdown" id="hero-countdown" hidden></p>
      </div>
      <div class="hero__scroll" aria-hidden="true">
        <span data-t="hero.scrollHint"></span>
        <svg class="icon"><use href="#i-down"/></svg>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 02 · BEFORE YOU ═══════════ -->
    <section class="chapter scene--ivory" id="before" data-chapter data-title="Once upon a you" data-act="begin" aria-labelledby="before-h">
      <div class="chapter__inner">
        <p class="kicker" data-t="beforeYou.kicker"></p>
        <h2 class="display" id="before-h" data-split data-t="beforeYou.title"></h2>
        <p class="lede lede--italic" data-t="beforeYou.line"></p>
        <div class="album" data-mount="album"></div>
        <p class="turnline" data-split data-t="beforeYou.turn"></p>
        <div class="firstphoto" data-mount="firstphoto"></div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 03 · HOW WE BECAME US ═══════════ -->
    <section class="chapter scene--ivory" id="became" data-chapter data-title="How we became us" data-act="begin" aria-labelledby="became-h">
      <div class="chapter__inner chapter__inner--wide">
        <p class="kicker" data-t="becameUs.kicker"></p>
        <h2 class="display" id="became-h" data-split data-t="becameUs.title"></h2>
        <p class="lede" data-t="becameUs.intro"></p>
        <div class="moments" data-mount="moments"></div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 04 · OUR TIMELINE ═══════════ -->
    <section class="chapter scene--wine" id="timeline" data-chapter data-title="Our timeline" data-act="story" aria-labelledby="timeline-h">
      <div class="chapter__inner chapter__inner--wide">
        <p class="kicker" data-t="timeline.kicker"></p>
        <h2 class="display" id="timeline-h" data-split data-t="timeline.title"></h2>
        <p class="lede" data-t="timeline.intro"></p>
        <div class="tl" data-mount="timeline"></div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 05 · OUR LITTLE UNIVERSE ═══════════ -->
    <section class="chapter scene--night" id="universe" data-chapter data-title="Our little universe" data-act="story" aria-labelledby="universe-h">
      <div class="chapter__inner chapter__inner--wide">
        <p class="kicker" data-t="universe.kicker"></p>
        <h2 class="display" id="universe-h" data-split data-t="universe.title"></h2>
        <p class="lede" data-t="universe.intro"></p>
        <div class="cosmos" data-mount="cosmos"></div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 06 · THE PHOTO ARCHIVE ═══════════ -->
    <section class="chapter scene--ivory" id="archive" data-chapter data-title="The archive" data-act="memory" aria-labelledby="archive-h">
      <div class="chapter__inner chapter__inner--wide">
        <p class="kicker" data-t="archive.kicker"></p>
        <h2 class="display" id="archive-h" data-split data-t="archive.title"></h2>
        <p class="lede" data-t="archive.intro"></p>
        <div class="masonry" data-mount="masonry"></div>

        <div class="strip-block" data-block="filmstrip">
          <h3 class="subhead" data-t="archive.stripTitle"></h3>
          <div class="strip-wrap">
            <button class="strip-arrow strip-arrow--l" type="button" aria-label="Scroll the reel backwards"><svg class="icon"><use href="#i-left"/></svg></button>
            <div class="strip" data-mount="filmstrip" tabindex="0" role="group" aria-label="Film reel of photos"></div>
            <button class="strip-arrow strip-arrow--r" type="button" aria-label="Scroll the reel forwards"><svg class="icon"><use href="#i-right"/></svg></button>
          </div>
        </div>

        <div class="stack-block" data-block="stack">
          <h3 class="subhead" data-t="archive.stackTitle"></h3>
          <p class="hint" data-t="archive.stackHint"></p>
          <div class="stack" data-mount="stack"></div>
          <div class="stack-meta">
            <p class="stack-caption" id="stack-caption"></p>
            <div class="stack-controls">
              <span class="stack-count" id="stack-count"></span>
              <button class="btn btn--ghost btn--small" id="stack-next" type="button">next photo</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 07 · MOVING MEMORIES ═══════════ -->
    <section class="chapter scene--night" id="films" data-chapter data-title="You, in motion" data-act="memory" aria-labelledby="films-h">
      <div class="chapter__inner chapter__inner--wide">
        <p class="kicker" data-t="videos.kicker"></p>
        <h2 class="display" id="films-h" data-split data-t="videos.title"></h2>
        <p class="lede" data-t="videos.intro"></p>
        <div class="cinema" data-mount="cinema"></div>
        <div class="reels" data-mount="reels"></div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 08 · THEN & NOW ═══════════ -->
    <section class="chapter scene--ivory" id="then-now" data-chapter data-title="Then &amp; now" data-act="memory" aria-labelledby="thennow-h">
      <div class="chapter__inner">
        <p class="kicker" data-t="thenNow.kicker"></p>
        <h2 class="display" id="thennow-h" data-split data-t="thenNow.title"></h2>
        <p class="hint" data-t="thenNow.hint"></p>
        <div class="compare-list" data-mount="compare"></div>
        <p class="lede lede--italic compare-caption" data-t="thenNow.caption"></p>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 09 · A LITTLE GAME ═══════════ -->
    <section class="chapter scene--ivory scene--tint" id="game" data-chapter data-title="A little game" data-act="you" aria-labelledby="game-h">
      <div class="chapter__inner">
        <p class="kicker" data-t="quiz.kicker"></p>
        <h2 class="display" id="game-h" data-split data-t="quiz.title"></h2>
        <p class="lede" data-t="quiz.intro"></p>
        <div class="quiz" data-mount="quiz"></div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 10 · THINGS I LOVE ABOUT YOU ═══════════ -->
    <section class="chapter scene--wine" id="love-list" data-chapter data-title="So you" data-act="you" aria-labelledby="love-h">
      <div class="chapter__inner">
        <p class="kicker" data-t="loveList.kicker"></p>
        <h2 class="display" id="love-h" data-split data-t="loveList.title"></h2>
        <p class="lede" data-t="loveList.intro"></p>
        <div class="lovelist" data-mount="lovelist"></div>
        <p class="lede lede--italic lovelist-outro" id="lovelist-outro" hidden data-t="loveList.outro"></p>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 11 · THE LITTLE THINGS ═══════════ -->
    <section class="chapter scene--ivory" id="little-things" data-chapter data-title="The little things" data-act="you" aria-labelledby="little-h">
      <div class="chapter__inner chapter__inner--wide">
        <p class="kicker" data-t="littleThings.kicker"></p>
        <h2 class="display" id="little-h" data-split data-t="littleThings.title"></h2>
        <p class="lede" data-t="littleThings.intro"></p>
        <p class="hint desk-hint" data-t="littleThings.hint"></p>
        <div class="desk" data-mount="desk"></div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 12 · OPEN WHEN… ═══════════ -->
    <section class="chapter scene--night" id="open-when" data-chapter data-title="Open when…" data-act="you" aria-labelledby="ow-h">
      <div class="chapter__inner chapter__inner--wide">
        <p class="kicker" data-t="openWhen.kicker"></p>
        <h2 class="display" id="ow-h" data-split data-t="openWhen.title"></h2>
        <p class="lede" data-t="openWhen.intro"></p>
        <div class="ow-grid" data-mount="openwhen"></div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 13 · OUR SONG ═══════════ -->
    <section class="chapter scene--wine" id="our-song" data-chapter data-title="Your soundtrack" data-act="you" aria-labelledby="song-h">
      <div class="chapter__inner">
        <p class="kicker" data-t="ourSong.kicker"></p>
        <h2 class="display" id="song-h" data-split data-t="ourSong.title"></h2>
        <p class="lede lede--italic" data-t="settings.song.line"></p>
        <div class="player" data-mount="player"></div>
        <p class="song-note" data-t="ourSong.note"></p>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 14 · IN MY VOICE ═══════════ -->
    <section class="chapter scene--night voicech" id="voice" data-chapter data-title="In your ears" data-act="you" aria-labelledby="voice-h">
      <div class="chapter__inner chapter__inner--narrow">
        <p class="kicker" data-t="voice.kicker"></p>
        <h2 class="display display--quiet" id="voice-h"><span data-t="voice.line1"></span><br><em data-t="voice.line2"></em></h2>
        <div class="voice-player" data-mount="voiceplayer"></div>
        <p class="voice-caption" data-t="voice.caption"></p>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 15 · A LETTER FOR YOU ═══════════ -->
    <section class="chapter scene--ivory" id="letter" data-chapter data-title="A letter" data-act="always" aria-labelledby="letter-h">
      <div class="chapter__inner chapter__inner--narrow letter-teaser">
        <p class="kicker" data-t="letter.kicker"></p>
        <h2 class="display display--quiet" id="letter-h" data-split data-t="letter.teaser"></h2>
        <button class="btn btn--wax" id="open-letter" type="button" data-magnet>
          <svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg>
          <span data-t="letter.button"></span>
        </button>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 16 · THE FUTURE ═══════════ -->
    <section class="chapter scene--dawn" id="future" data-chapter data-title="The year ahead" data-act="always" aria-labelledby="future-h">
      <div class="chapter__inner chapter__inner--wide">
        <p class="kicker" data-t="future.kicker"></p>
        <h2 class="display" id="future-h" data-split data-t="future.titleA"></h2>
        <p class="display display--italic future-b" data-split data-t="future.titleB"></p>
        <div class="plans-wrap">
          <div class="plans hstrip" data-mount="plans" tabindex="0" role="group" aria-label="Plans for the future"></div>
        </div>
      </div>
    </section>

    <!-- ═══════════ CHAPTER 17 · FINALE ═══════════ -->
    <section class="chapter scene--void finale" id="finale" data-chapter data-title="Happy birthday" data-act="always" aria-label="Finale">
      <div class="finale__quiet" data-mount="finale-quiet"></div>
      <div class="finale__scene" id="finale-scene">
        <div class="finale__pin">
          <div class="starfield" id="starfield" aria-hidden="true"></div>
          <figure class="finale__photo" data-mount="finale-photo"></figure>
        </div>
      </div>
      <div class="finale__more" data-mount="finale-more"></div>
    </section>

  </main>

  <!-- ═══════════ fixed UI ═══════════ -->
  <div class="hairline" id="hairline" aria-hidden="true"><i></i></div>

  <button class="navpill" id="navpill" type="button" hidden aria-haspopup="dialog" aria-label="Open the story chapters">
    <svg class="navpill__ring" viewBox="0 0 36 36" aria-hidden="true">
      <circle class="navpill__track" cx="18" cy="18" r="15.5"/>
      <circle class="navpill__fill" cx="18" cy="18" r="15.5"/>
    </svg>
    <span class="navpill__num" id="navpill-num">01</span>
  </button>

  <button class="soundpill" id="soundpill" type="button" hidden aria-pressed="false" aria-label="Play the soundtrack">
    <svg class="icon icon--on" aria-hidden="true"><use href="#i-sound"/></svg>
    <svg class="icon icon--off" aria-hidden="true"><use href="#i-mute"/></svg>
  </button>
  <div class="toast" id="sound-toast" hidden>
    <svg class="icon" aria-hidden="true"><use href="#i-note"/></svg>
    <span>this story has a soundtrack</span>
  </div>

  <!-- ═══════════ dialogs ═══════════ -->
  <dialog class="dlg dlg--lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="dlg__card lightbox">
      <button class="dlg__close" data-close type="button" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
      <div class="lightbox__stage">
        <button class="lightbox__nav lightbox__nav--l" id="lb-prev" type="button" aria-label="Previous photo"><svg class="icon"><use href="#i-left"/></svg></button>
        <img class="lightbox__img" id="lb-img" alt="">
        <button class="lightbox__nav lightbox__nav--r" id="lb-next" type="button" aria-label="Next photo"><svg class="icon"><use href="#i-right"/></svg></button>
      </div>
      <div class="lightbox__meta">
        <p class="lightbox__caption" id="lb-caption"></p>
        <p class="lightbox__sub"><span id="lb-date"></span><span class="lightbox__count" id="lb-count"></span></p>
      </div>
    </div>
  </dialog>

  <dialog class="dlg" id="modal" aria-label="Detail">
    <div class="dlg__card modal" id="modal-card">
      <button class="dlg__close" data-close type="button" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </dialog>

  <dialog class="dlg dlg--sheet" id="navsheet" aria-label="Story chapters">
    <div class="dlg__card navsheet">
      <button class="dlg__close" data-close type="button" aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
      <p class="navsheet__title">The story so far</p>
      <nav class="navsheet__list" id="navsheet-list" aria-label="Chapters"></nav>
    </div>
  </dialog>

  <!-- custom cursor (desktop only) -->
  <div class="cursor" id="cursor" aria-hidden="true"><i class="cursor__dot"></i><i class="cursor__ring"></i></div>

  <script src="js/content.js"></script>
  <script src="js/util.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
